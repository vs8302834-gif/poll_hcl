<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>
<body>

<h2>Realtime WebSocket Test</h2>

<p id="status">Connecting...</p>
<pre id="messages"></pre>

<script>
const shareToken =
    "3cacf879-b92f-4a8e-aa04-339fdc28ff54";

const ws = new WebSocket(
    `ws://localhost:8080/api/polls/share/${shareToken}/ws`
);

ws.onopen = () => {
    document.getElementById("status").textContent =
        "WebSocket connected!";
};

ws.onmessage = (event) => {
    console.log("REALTIME UPDATE:", event.data);

    document.getElementById("messages").textContent =
        event.data;
};

ws.onerror = (error) => {
    console.log("WebSocket error:", error);

    document.getElementById("status").textContent =
        "WebSocket error";
};

ws.onclose = () => {
    document.getElementById("status").textContent =
        "WebSocket closed";
};
</script>

</body>
</html>
